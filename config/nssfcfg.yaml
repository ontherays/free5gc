info:
  version: 1.0.2
  description: NSSF initial local configuration

configuration:
  nssfName: NSSF # the name of this NSSF
  sbi: # Service-based interface information
    scheme: http # the protocol for sbi (http or https)
    registerIPv4: 127.0.0.31 # IP used to register to NRF
    bindingIPv4: 127.0.0.31  # IP used to bind the service
    port: 8000 # Port used to bind the service
    tls: # the local path of TLS key
      pem: cert/nssf.pem # NSSF TLS Certificate
      key: cert/nssf.key # NSSF TLS Private key
  serviceNameList: # the SBI services provided by this NSSF
    - nnssf-nsselection # Nnssf_NSSelection service
    - nnssf-nssaiavailability # Nnssf_NSSAIAvailability service
  nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem # NRF Certificate

  # PLMNs supported by this NSSF (quoted so leading zeros are preserved as strings)
  supportedPlmnList:
    - mcc: "001" # Mobile Country Code
      mnc: "01"  # Mobile Network Code

  # Supported S-NSSAI list for the PLMN — single slice: SST 1, blank SD
  supportedNssaiInPlmnList:
    - plmnId:
        mcc: "001"
        mnc: "01"
      supportedSnssaiList:
        - sst: 1

  # Network Slice Instance for SST 1
  nsiList:
    - snssai:
        sst: 1
      nsiInformationList:
        - nrfId: http://127.0.0.10:8000/nnrf-nfm/v1/nf-instances
          nsiId: 10

  # AMF Set — the availability data per TA that this NSSF matches against.
  # amfList must contain your AMF's NF instance ID(s); mismatches are tolerated
  # for basic NS selection but keep them in sync with your running AMF.
  amfSetList:
    - amfSetId: 1
      amfList:
        - <AMF_UUID>
      nrfAmfSet: http://127.0.0.10:8000/nnrf-nfm/v1/nf-instances
      supportedNssaiAvailabilityData:
        - tai:
            plmnId:
              mcc: "001"
              mnc: "01"
            tac: "000001" # must match the gNB-broadcast TAC and amfcfg supportTaiList
          supportedSnssaiList:
            - sst: 1

  # Tracking areas supported by this NSSF instance
  taList:
    - tai:
        plmnId:
          mcc: "001"
          mnc: "01"
        tac: "000001"
      accessType: 3GPP_ACCESS
      supportedSnssaiList:
        - sst: 1

logger: # log output setting
  enable: true # true or false
  level: info # trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not